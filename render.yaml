databases:
  - name: world-dominion-db
    plan: basic-256mb
    databaseName: world_dominion
    user: world_dominion
services:
  - type: web
    name: world-dominion-server
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: world-dominion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGINS
        value: "*"
